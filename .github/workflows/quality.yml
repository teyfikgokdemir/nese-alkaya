name: Quality Gate & Automated Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, TypeCheck & Verify (54 Routes)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci --prefer-offline --no-fund

      - name: Astro TypeScript Diagnostic Check
        run: npm run check

      - name: Static Build & Strict Verification
        run: npm run build

      - name: Offline IndexNow Protocol Validation
        run: npm run indexnow:check

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical
